description: In this project, we investigated the effects of local versus systemic
  chemogenetic suppression of dopamine D2 receptor-expressing medium spiny neurons
  (D2-MSNs) on neuronal activity in the globus pallidus pars externa (GPe). These
  experiments were designed to assess whether local activation of inhibitory hM4D(Gi)
  receptors in the striatum alters downstream GPe activity, providing insight into
  the circuit specificity of chemogenetic manipulations used to study striatal lateral
  inhibition in a mouse model of Parkinson's disease and levodopa-induced dyskinesia.
  We recorded extracellular single-unit activity in the GPe of 6-OHDA-lesioned mice
  expressing hM4D(Gi) in D2-MSNs. We compared the effects of local intrastriatal infusion
  and systemic administration of clozapine-N-oxide (CNO) on GPe neuronal firing rates.
  Local striatal CNO administration did not significantly alter GPe firing rates,
  whereas systemic CNO administration increased GPe firing rates, consistent with
  disinhibition of the GPe through suppression of D2-MSN projections. Following recordings,
  extracellular signals were spike sorted (Kilosort) to isolate single units, and
  neuronal firing rates were analyzed across experimental conditions
